{{- range $component := list "serve" "control" }}
{{- $role := index $.Values $component }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sekai-master-api.fullname" $ }}-{{ $component }}
  labels:
    {{- include "sekai-master-api.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
spec:
  {{- if not (and (eq $component "serve") $role.autoscaling.enabled) }}
  replicas: {{ $role.replicaCount }}
  {{- end }}
  revisionHistoryLimit: {{ $.Values.common.revisionHistoryLimit }}
  strategy:
    {{- if eq $component "control" }}
    type: Recreate
    {{- else }}
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
    {{- end }}
  selector:
    matchLabels:
      {{- include "sekai-master-api.selectorLabels" (dict "Chart" $.Chart "Release" $.Release "Values" $.Values "component" $component) | nindent 6 }}
  template:
    metadata:
      {{- $annotations := mergeOverwrite (dict) $.Values.common.podAnnotations $role.podAnnotations }}
      {{- with $annotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- $podLabels := mergeOverwrite (dict) $.Values.common.podLabels $role.podLabels }}
      {{- $_ := set $podLabels "app.kubernetes.io/name" (include "sekai-master-api.name" $) }}
      {{- $_ := set $podLabels "app.kubernetes.io/instance" $.Release.Name }}
      {{- $_ := set $podLabels "app.kubernetes.io/component" $component }}
      labels:
        {{- toYaml $podLabels | nindent 8 }}
    spec:
      serviceAccountName: {{ include "sekai-master-api.serviceAccountName" $ }}
      automountServiceAccountToken: {{ $.Values.serviceAccount.automount }}
      terminationGracePeriodSeconds: {{ $.Values.common.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml $.Values.common.podSecurityContext | nindent 8 }}
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ $component }}
          image: {{ printf "%s:%s" $.Values.image.repository $.Values.image.tag | quote }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          command: ["/usr/local/bin/sekai-master-api"]
          args: [{{ $component | quote }}]
          securityContext:
            {{- toYaml $.Values.common.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            {{- include "sekai-master-api.env" (dict "Values" $.Values "role" $role) | nindent 12 }}
            {{- $gomeLimit := include "sekai-master-api.gomeMemLimitEnv" (dict "Values" $.Values "role" $role) -}}
            {{- if $gomeLimit }}{{ $gomeLimit | nindent 12 }}{{ end -}}
          {{- if or $.Values.common.envFrom.configMaps $.Values.common.envFrom.secrets $role.envFrom.configMaps $role.envFrom.secrets }}
          envFrom:
            {{- include "sekai-master-api.envFrom" (dict "Values" $.Values "role" $role) | nindent 12 }}
          {{- end }}
          {{- include "sekai-master-api.probes" (dict "probes" $role.probes) | nindent 10 }}
          resources:
            {{- toYaml $role.resources | nindent 12 }}
          {{- $baseMounts := list -}}
          {{- if eq $component "control" -}}
            {{- $baseMounts = append $baseMounts (dict "name" "master-data-backup" "mountPath" "/app/tmp/master-data-backup") -}}
            {{- if or (not (hasKey $role.resumeVolume "enabled")) $role.resumeVolume.enabled -}}
              {{- $baseMounts = append $baseMounts (dict "name" "master-data-sync-resume" "mountPath" (default "/app/tmp/master-data-sync-resume" $role.resumeVolume.mountPath)) -}}
            {{- end -}}
          {{- end -}}
          {{- $allMounts := concat $baseMounts (default list $.Values.common.extraVolumeMounts) (default list $role.extraVolumeMounts) -}}
          {{- with $allMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- $baseVolumes := list -}}
      {{- if eq $component "control" -}}
        {{- if $role.backupVolume.persistentVolumeClaim -}}
          {{- $baseVolumes = append $baseVolumes (dict "name" "master-data-backup" "persistentVolumeClaim" (dict "claimName" $role.backupVolume.persistentVolumeClaim)) -}}
        {{- else -}}
          {{- $baseVolumes = append $baseVolumes (dict "name" "master-data-backup" "emptyDir" (dict)) -}}
        {{- end -}}
        {{- if or (not (hasKey $role.resumeVolume "enabled")) $role.resumeVolume.enabled -}}
          {{- if $role.resumeVolume.persistentVolumeClaim -}}
            {{- $baseVolumes = append $baseVolumes (dict "name" "master-data-sync-resume" "persistentVolumeClaim" (dict "claimName" $role.resumeVolume.persistentVolumeClaim)) -}}
          {{- else -}}
            {{- $baseVolumes = append $baseVolumes (dict "name" "master-data-sync-resume" "emptyDir" (dict)) -}}
          {{- end -}}
        {{- end -}}
      {{- end -}}
      {{- $allVolumes := concat $baseVolumes (default list $.Values.common.extraVolumes) (default list $role.extraVolumes) -}}
      {{- with $allVolumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.common.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.common.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.common.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.common.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
