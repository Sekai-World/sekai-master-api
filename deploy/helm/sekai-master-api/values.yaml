nameOverride: ""
fullnameOverride: ""

image:
  repository: sekai-master-api
  tag: "0.1.0"
  pullPolicy: IfNotPresent
imagePullSecrets: []

serviceAccount:
  create: true
  automount: false
  annotations: {}
  name: ""

common:
  podAnnotations: {}
  podLabels: {}
  env:
    APP_ENV: production
    DATABASE_DRIVER: pgx
  # Bounded graceful-shutdown deadline (seconds). Injected as the explicit
  # SHUTDOWN_TIMEOUT_SECONDS env entry on every pod (serve, control, migration Job).
  # This is the single source for that variable: do not set SHUTDOWN_TIMEOUT_SECONDS
  # in common.env, a role's env, or any extraEnv list. The chart fails at template
  # time if this value is greater than or equal to terminationGracePeriodSeconds
  # (default 30), which JSON Schema cannot enforce dynamically.
  shutdownTimeoutSeconds: 25
  envFrom:
    configMaps: []
    secrets: []
  extraEnv: []
  extraVolumes: []
  extraVolumeMounts: []
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    fsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
    readOnlyRootFilesystem: true
  terminationGracePeriodSeconds: 30
  revisionHistoryLimit: 3
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []

serve:
  replicaCount: 2
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: null
    behavior: {}
    additionalMetrics: []
  podAnnotations: {}
  podLabels: {}
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi
  env: {}
  envFrom:
    configMaps: []
    secrets: []
  extraEnv: []
  extraVolumes: []
  extraVolumeMounts: []
  service:
    type: ClusterIP
    port: 80
  probes:
    startup:
      # /startupz only gates process boot + database migrations; it does NOT
      # wait for master-data sync. During a cold-start sync the pod shows as
      # degraded via /readyz (NotReady, no restarts).
      enabled: true
      failureThreshold: 30
      periodSeconds: 5
    liveness:
      enabled: true
      initialDelaySeconds: 10
      periodSeconds: 10
    readiness:
      # /readyz for the serve role is a bounded, read-only check: it verifies
      # PostgreSQL (via /startupz) and Redis connectivity, then requires every
      # configured region to have persisted card records AND version metadata
      # before reporting the pod ready. A failed or in-progress control sync does
      # not block readiness once records exist (surfaced via regions_pending_sync).
      enabled: true
      initialDelaySeconds: 5
      periodSeconds: 10

control:
  replicaCount: 1
  podAnnotations: {}
  podLabels: {}
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi
  env: {}
  envFrom:
    configMaps: []
    secrets: []
  extraEnv: []
  extraVolumes: []
  extraVolumeMounts: []
  service:
    type: ClusterIP
    port: 80
  probes:
    startup:
      # /startupz only gates process boot + database migrations; master-data
      # sync runs in the background afterwards and is surfaced as degraded via
      # /readyz (NotReady, no restarts).
      enabled: true
      failureThreshold: 60
      periodSeconds: 5
    liveness:
      enabled: true
      initialDelaySeconds: 10
      periodSeconds: 10
    readiness:
      enabled: true
      initialDelaySeconds: 5
      periodSeconds: 10
  backupVolume:
    persistentVolumeClaim: ""
  resumeVolume:
    enabled: true
    mountPath: /app/tmp/master-data-sync-resume
    persistentVolumeClaim: ""

migration:
  enabled: true
  hookWeight: -5
  hookDeletePolicy: before-hook-creation,hook-succeeded
  backoffLimit: 1
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 300
  serviceAccountName: ""
  podAnnotations: {}
  podLabels: {}
  env: {}
  envFrom:
    configMaps: []
    secrets: []
  extraEnv: []
  resources:
    requests:
      cpu: 100m
      ephemeral-storage: 128Mi
      memory: 128Mi
    limits:
      ephemeral-storage: 256Mi
      memory: 256Mi

podDisruptionBudget:
  serve:
    enabled: false
    minAvailable: 1
  control:
    enabled: false
    maxUnavailable: 0

networkPolicy:
  enabled: false
  ingress: []
  egress: []

ingress:
  className: nginx
  public:
    enabled: true
    host: master-api.example.com
    annotations: {}
    tls:
      enabled: false
      secretName: ""
  control:
    enabled: true
    host: master-api-admin.example.com
    exposeDocs: false
    annotations:
      nginx.org/proxy-buffering: "False"
      nginx.org/proxy-read-timeout: "3600s"
      nginx.org/proxy-send-timeout: "3600s"
    tls:
      enabled: false
      secretName: ""
