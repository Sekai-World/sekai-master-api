name: SonarCloud

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  sonarcloud:
    name: SonarCloud
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3

      # PostgreSQL-backed tests start a postgres:18 container through
      # testcontainers-go on the runner's Docker, as in the CI workflow.
      - name: Run tests with coverage
        run: go test -buildvcs=false -coverprofile=coverage.out ./...

      # Fork and Dependabot pull requests cannot read SONAR_TOKEN.
      - name: SonarCloud Scan
        if: >-
          github.event_name == 'push' ||
          (
            github.event.pull_request.head.repo.full_name == github.repository &&
            github.event.pull_request.user.login != 'dependabot[bot]'
          )
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
