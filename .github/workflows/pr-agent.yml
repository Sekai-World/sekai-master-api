name: PR Agent

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:
    types: [created]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  pr-agent:
    # Gating rules:
    # 1. Never react to bot senders (loop prevention).
    # 2. Slash commands via issue_comment run only for trusted actors (repo owner
    #    account, org members with public membership, direct collaborators).
    #    GitHub events do not expose an admin/maintain role, so OWNER/MEMBER/
    #    COLLABORATOR is the closest available proxy for admins and maintainers.
    # 3. Automatic reviews run only for same-repository PRs because fork PR
    #    events do not receive repository secrets; maintainers can still invoke
    #    commands on fork PRs through issue_comment. Never switch this workflow
    #    to pull_request_target.
    if: >-
      ${{
        github.event.sender.type != 'Bot'
        && (
          github.event_name == 'pull_request'
          || contains('OWNER MEMBER COLLABORATOR', github.event.comment.author_association)
        )
        && (
          github.event_name == 'issue_comment'
          || github.event.pull_request.head.repo.full_name == github.repository
        )
      }}
    runs-on: ubuntu-latest

    steps:
      - name: Run PR-Agent
        # Official PR-Agent GitHub Action image, pinned to the v0.43.0 release by
        # version tag plus its OCI index digest (Sigstore build-provenance
        # attestation verified against The-PR-Agent/pr-agent). The explicit tag
        # keeps Renovate resolving the pinned reference instead of `latest`.
        # Re-pin only after re-verifying:
        #   gh attestation verify oci://index.docker.io/pragent/pr-agent@sha256:<digest> --repo The-PR-Agent/pr-agent
        uses: docker://pragent/pr-agent:0.46.0-github_action@sha256:65e5b196e38cecd7df8a71fe29942052e081a0c6645132c2ac874df60b1760c7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Create the GEMINI_API_KEY Actions secret to enable the provider.
          GOOGLE_AI_STUDIO.GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Custom OpenAI-compatible endpoint (Google v1beta/openai), passed by
          # pr-agent directly to litellm so env-var precedence cannot reroute it.
          openai.key: ${{ secrets.GEMINI_API_KEY }}
          openai.api_base: https://generativelanguage.googleapis.com/v1beta/openai
          config.model: openai/gemini-3.6-flash
          # Route via Google's OpenAI-compatible endpoint: the bundled litellm in this
          # pr-agent image 404s on gemini-3.x through its native gemini provider.
          # Fallbacks must share this endpoint: PR-Agent passes the single openai.api_base
          # to every model's completion call, so openrouter/* fallbacks were sent to
          # Google and rejected (400 "Unknown name \"usage\""). Gemini quotas and
          # overload (429/503) apply per model, so other Gemini models still answer.
          config.fallback_models: '["openai/gemini-3.7-flash", "openai/gemini-3.5-flash", "openai/gemini-3.5-flash-lite"]'
          # Retry transient 429/503s before moving to the next model.
          config.litellm_retries: "6"
          # PR-Agent raises for models missing from its MAX_TOKENS registry unless
          # this is set; required for the openai/gemini-* slugs.
          config.custom_model_max_tokens: "200000"
          config.max_model_tokens: "200000"
          config.ai_timeout: "300"
          # Defense-in-depth: skip tools that require elevated permissions
          # (e.g. /update_changelog commit-push mode); we never grant contents: write.
          config.restricted_mode: "true"
          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "false"
          github_action_config.auto_improve: "false"
          # Review again on every push, so a failed or outdated review is retried.
          github_action_config.handle_push_trigger: "true"
          github_action_config.push_commands: '["/review"]'
