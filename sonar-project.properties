sonar.projectKey=Sekai-World_sekai-master-api
sonar.organization=sekai-world
sonar.sourceEncoding=UTF-8
sonar.sources=cmd,internal
sonar.exclusions=**/*_test.go
sonar.tests=cmd,internal
sonar.test.inclusions=**/*_test.go
# Written by the SonarCloud workflow (.github/workflows/sonarcloud.yml).
sonar.go.coverage.reportPaths=coverage.out
# Generated Swagger output and test-only helpers carry no coverage of their own.
sonar.coverage.exclusions=internal/transport/http/swaggerdocs/**,internal/transport/http/handlers/testutil/**,internal/storage/pgtest/**
sonar.cpd.exclusions=internal/transport/http/swaggerdocs/docs.go,internal/transport/http/swaggerdocs/swagger.json,internal/transport/http/swaggerdocs/swagger.yaml
